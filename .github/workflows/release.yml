# 發新版:推一個 v 開頭的 tag(例如 v2.1.0,要跟 app/package.json 的 version 一樣)
# → GitHub 的 Windows 電腦自動打包安裝檔 → 發布到 Releases
# → 大家的「9427 FRC 模擬器」打開時就會自動下載更新
name: 發布新版(Windows 安裝檔)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: 檢查版本號跟 tag 一樣
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          V=$(node -p "require('./app/package.json').version")
          if [ "v$V" != "${GITHUB_REF_NAME}" ]; then echo "app/package.json 是 $V,tag 是 ${GITHUB_REF_NAME},要一樣"; exit 1; fi
      - name: 安裝
        working-directory: app
        run: npm ci
      - name: 自動測試
        run: |
          node tests/mechlab.test.js
          node tests/drive.test.js
          node tests/engine.test.js
      - name: 打包 + 發布到 Releases
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release
