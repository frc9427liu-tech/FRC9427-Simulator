<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>9427 FRC 模擬器</title>
<style>
  :root { --bg: #0d1117; --panel: #161b22; --panel2: #1c2230; --line: #30363d; --text: #e6edf3; --dim: #8b98a5; --accent: #2f81f7; --bad: #f85149; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: "Microsoft JhengHei", "Segoe UI", sans-serif; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 44px 32px; }
  h1 { margin: 0; font-size: 30px; font-weight: 800; }
  h1 span { color: #c8102e; }
  .sub { color: var(--dim); margin: 6px 0 34px; font-size: 14px; }
  .grid { display: grid; grid-template-columns: 280px 1fr; gap: 32px; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  h2 { font-size: 13px; color: var(--dim); font-weight: 700; letter-spacing: .05em; margin: 0 0 12px; }
  .big { display: flex; align-items: center; gap: 10px; width: 100%; padding: 14px 16px; border-radius: 10px; border: 0; cursor: pointer;
    background: var(--accent); color: #fff; font: 700 16px inherit; font-family: inherit; }
  .big:hover { filter: brightness(1.1); }
  .tip { color: var(--dim); font-size: 13px; line-height: 1.7; margin-top: 14px; }
  .tip code { background: var(--panel2); padding: 1px 5px; border-radius: 4px; color: var(--text); }
  .list { display: flex; flex-direction: column; gap: 6px; }
  .item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); cursor: pointer; }
  .item:hover { border-color: var(--accent); }
  .item.missing { opacity: .55; cursor: default; }
  .item .ic { font-size: 22px; }
  .item .t { flex: 1; min-width: 0; }
  .item .n { font-weight: 700; font-size: 15px; }
  .item .p { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .d { color: var(--dim); font-size: 12px; white-space: nowrap; }
  .item .x { border: 0; background: transparent; color: var(--dim); font-size: 16px; cursor: pointer; padding: 4px 8px; border-radius: 6px; }
  .item .x:hover { color: var(--bad); background: #f8514922; }
  .empty { color: var(--dim); font-size: 14px; padding: 16px; border: 1px dashed var(--line); border-radius: 8px; }
  .busy { position: fixed; inset: 0; background: #0d1117cc; display: none; align-items: center; justify-content: center; font-size: 18px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🤖 FRC 模擬器 <span>9427</span></h1>
  <div class="sub">打開任何一隊的 WPILib 機器人專案,不用接機器人,在電腦上用搖桿操作、看 3D 畫面。</div>
  <div class="grid">
    <div>
      <h2>開始</h2>
      <button class="big" id="open">📂 開啟機器人專案資料夾</button>
      <button class="big" id="help" style="margin-top:10px;background:var(--panel2);border:1px solid var(--line)">📖 新手教學(電腦操作)</button>
      <div class="tip">
        選 VS Code 裡打開的那個資料夾就對了(裡面有 <code>gradlew.bat</code> 和 <code>build.gradle</code>)。<br>
        第一次開要編譯,大約 30 秒。<br>
        電腦要先裝好 <b>WPILib 2026</b>。
      </div>
    </div>
    <div>
      <h2>最近開過的專案</h2>
      <div class="list" id="list"></div>
    </div>
  </div>
</div>
<div class="busy" id="busy">開啟中…</div>
<script>
  const listEl = document.getElementById('list');
  const fmt = t => {
    if (!t) return '';
    const d = new Date(t), now = new Date();
    return d.toDateString() === now.toDateString() ? '今天 ' + d.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' })
      : d.toLocaleDateString('zh-TW');
  };
  function render(items) {
    listEl.innerHTML = '';
    if (!items.length) { listEl.innerHTML = '<div class="empty">還沒有開過專案。按左邊「開啟機器人專案資料夾」。</div>'; return; }
    for (const r of items) {
      const el = document.createElement('div');
      el.className = 'item' + (r.exists ? '' : ' missing');
      el.title = r.exists ? '開啟 ' + r.path : '找不到這個資料夾(被移走或刪掉了)';
      el.innerHTML = `<div class="ic">${r.exists ? '📁' : '⚠️'}</div><div class="t"><div class="n"></div><div class="p"></div></div><div class="d"></div>`;
      el.querySelector('.n').textContent = r.name;
      el.querySelector('.p').textContent = r.exists ? r.path : '找不到:' + r.path;
      el.querySelector('.d').textContent = fmt(r.last);
      const x = document.createElement('button');
      x.className = 'x'; x.textContent = '✕'; x.title = '從清單移除(不會刪掉資料夾)';
      x.onclick = async e => { e.stopPropagation(); render(await sim.removeRecent(r.path)); };
      el.append(x);
      if (r.exists) el.onclick = () => open(r.path);
      listEl.append(el);
    }
  }
  async function open(dir) {
    if (!dir) return;
    document.getElementById('busy').style.display = 'flex';
    const r = await sim.openProject(dir);
    if (!r.ok) { document.getElementById('busy').style.display = 'none'; render(await sim.recents()); }
  }
  document.getElementById('open').onclick = async () => open(await sim.pickFolder());
  document.getElementById('help').onclick = () => sim.openHelp();
  sim.recents().then(render);
</script>
</body>
</html>
