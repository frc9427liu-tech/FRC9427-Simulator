<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>9427 FRC 模擬器</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d1117; color: #e6edf3; font-family: "Microsoft JhengHei", sans-serif;
    display: flex; align-items: center; justify-content: center; user-select: none; -webkit-app-region: drag; }
  .box { text-align: center; }
  h1 { margin: 0 0 6px; font-size: 26px; }
  h1 span { color: #c8102e; }
  #msg { color: #8b98a5; font-size: 15px; margin-top: 14px; min-height: 20px; }
  #sub { color: #6e7781; font-size: 12px; margin-top: 6px; }
  .bar { width: 280px; height: 6px; margin: 18px auto 0; background: #21262d; border-radius: 3px; overflow: hidden; }
  .bar div { width: 35%; height: 100%; background: linear-gradient(90deg, #2f81f7, #8957e5); border-radius: 3px; animation: run 1.3s ease-in-out infinite; }
  @keyframes run { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
</style>
</head>
<body>
<div class="box">
  <h1>🤖 FRC 模擬器 <span>9427</span></h1>
  <div class="bar"><div></div></div>
  <div id="msg">準備中…</div>
  <div id="sub"></div>
</div>
<script>
  // main.js 會呼叫這個更新文字
  function setMsg(msg, sub) {
    document.getElementById('msg').textContent = msg;
    document.getElementById('sub').textContent = sub || '';
  }
</script>
</body>
</html>
